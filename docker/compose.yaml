x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  CORE-SITE.XML_fs.default.name: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  # Hue habla con HDFS como su propio usuario ("hue") e impersona
  # (doas=...) al usuario que ha iniciado sesión en Hue. Sin esto, el
  # namenode lo rechaza con "User: hue is not allowed to impersonate ...".
  # Entorno de un solo usuario/desarrollo: se permite desde cualquier host.
  CORE-SITE.XML_hadoop.proxyuser.hue.hosts: "*"
  CORE-SITE.XML_hadoop.proxyuser.hue.groups: "*"

services:
  spark-master:
    build: ./spark/image
    image: python-hdfs-spark/spark:4.2.0-python3.14
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"   # RPC del master, usado en setMaster('spark://...')
      - "8080:8080"   # UI web del master
      - "4040:4040"   # UI web de la aplicación (driver en modo client)
    volumes:
      - ../:/opt/project
    networks:
      - spark-hdfs-net

  spark-worker:
    build: ./spark/image
    image: python-hdfs-spark/spark:4.2.0-python3.14
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # UI web del worker
    volumes:
      - ../:/opt/project
    networks:
      - spark-hdfs-net

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
    ports:
      - "9870:9870"   # UI web del namenode
      - "8020:8020"   # RPC del namenode (clientes HDFS nativos)
    volumes:
      - ./volumes/hdfs/namenode:/tmp/hadoop-hadoop
    networks:
      - spark-hdfs-net

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-env
    depends_on:
      - namenode
    ports:
      - "9864:9864"   # UI web del datanode
    volumes:
      - ./volumes/hdfs/datanode:/tmp/hadoop-hadoop
    networks:
      - spark-hdfs-net

  hive-metastore:
    image: apache/hive:4.2.1
    container_name: hive-metastore
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    depends_on:
      - namenode
    ports:
      - "9083:9083"   # Thrift del metastore
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
      - ./volumes/hive/data:/opt/hive/data
    networks:
      - spark-hdfs-net

  hive-server2:
    image: apache/hive:4.2.1
    container_name: hive-server2
    hostname: hive-server2
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Dhive.metastore.uris=thrift://hive-metastore:9083"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      IS_RESUME: "true"
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"  # JDBC/Thrift (beeline, Hue)
      - "10002:10002"  # UI web de HiveServer2
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
    networks:
      - spark-hdfs-net

  zeppelin:
    build: ./zeppelin/image
    image: python-hdfs-spark/zeppelin:python-3.14
    container_name: zeppelin
    hostname: zeppelin
    environment:
      ZEPPELIN_ADDR: "0.0.0.0"
      SPARK_MASTER: spark://spark-master:7077
    depends_on:
      - spark-master
      - hive-server2
    ports:
      - "8082:8080"   # UI web de Zeppelin (8080/8081 ya usados por Spark)
    volumes:
      - ../:/opt/project
      - ./volumes/zeppelin/notebook:/opt/zeppelin/notebook
      - ./volumes/zeppelin/logs:/opt/zeppelin/logs
      - ./zeppelin/ejemplos:/opt/zeppelin/notebook/ejemplos
      # Persiste conf/ (interpreter.json en particular) para no tener que
      # reaplicar zeppelin.spark.enableSupportedVersionCheck=false /
      # zeppelin.pyspark.useIPython=false tras cada --force-recreate. OJO:
      # bind-montar solo interpreter.json (un único fichero) rompe la
      # escritura atómica de Zeppelin ("Device or resource busy" al hacer
      # rename sobre un fichero bind-mounted) — hay que montar el
      # directorio completo, sembrado con TODOS sus ficheros (no solo
      # interpreter.json), para que el rename ocurra dentro del propio
      # directorio y no sobre el inodo bind-mounted. Ver docker/00_init.sh
      # (siembra desde zeppelin/conf-seed/ la primera vez) y CLAUDE.md.
      - ./volumes/zeppelin/conf:/opt/zeppelin/conf
    networks:
      - spark-hdfs-net

  hue:
    image: gethue/hue@sha256:7d5c1b9f8a79ac987e3a04fba987890dd9cd6055c6c475e63fcb0355455fa4e1
    container_name: hue
    hostname: hue
    ports:
      - "8888:8888"
    volumes:
      # hue.ini es generado por docker/00_init.sh a partir de
      # hue.ini.template (versionado) — trae, entre otras cosas, la
      # conexión a "postgres" con su contraseña, que por eso no puede ser
      # un fichero fijo en git. Ver docker/postgres más abajo.
      - ./hue/hue.ini:/usr/share/hue/desktop/conf/z-hue.ini:ro
    depends_on:
      - namenode
      - hive-server2
      - postgres
    networks:
      - spark-hdfs-net

  postgres:
    # BBDD relacional de ejemplo — para el ejemplo de Spark que lee vía
    # JDBC (01_connect_postgres.py en la raíz del proyecto) y para
    # consultar desde Hue (registrada como conexión en hue.ini.template).
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    env_file:
      - ./postgres/.env
    environment:
      POSTGRES_USER: pyhdfsspark
      POSTGRES_DB: pyhdfsspark
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez que arranca (volumen de datos
      # vacío) — la imagen oficial de postgres lo hace así, no en cada
      # arranque.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyhdfsspark -d pyhdfsspark"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spark-hdfs-net

  seaweedfs:
    # Servidor S3 (SeaweedFS), como alternativa a HDFS para subir datos.
    # Modo "server" de un solo nodo (master+volume+filer en el mismo
    # proceso, con -s3): suficiente para este proyecto, sin necesidad de
    # replicación/alta disponibilidad. Puertos de host remapeados porque
    # 8080 (spark-master) y 8888 (hue) ya están ocupados en este
    # docker-compose — los puertos INTERNOS del contenedor siguen siendo
    # los estándar de SeaweedFS (9333/8080/8888/8333).
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    hostname: seaweedfs
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.port=9333 -volume.port=8080 -volume.max=0
      -filer -filer.port=8888
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9337:9333"   # API/UI del master
      - "8085:8080"   # API/UI del volume server
      - "8889:8888"   # API/UI del filer
      - "8333:8333"   # API S3
    volumes:
      - ./volumes/seaweedfs:/data
      - ./seaweedfs/s3-config/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - spark-hdfs-net

  kafka:
    # Un solo broker en modo KRaft (sin ZooKeeper, ya no hace falta desde
    # Kafka 4.x) — lo más simple posible para el ejemplo de streaming
    # (streaming/03_structured_streaming_kafka.py). Sin autenticación ni
    # réplicas, cluster de desarrollo de un solo nodo.
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners PLAINTEXT porque hay dos tipos de cliente distintos:
      # "PLAINTEXT" (puerto 9092, publicado al host) para clientes que se
      # ejecutan en el HOST, como streaming/02_kafka_productor.py o
      # streaming/03_structured_streaming_kafka.py lanzados con
      # `python ...`; "PLAINTEXT_INTERNAL" (puerto 29092, NO publicado al
      # host, solo accesible dentro de la red docker) para clientes que
      # corren DENTRO de otro contenedor del compose, como Zeppelin
      # (%pyspark). Kafka, tras la conexión inicial, le dice al cliente a
      # qué dirección reconectarse para leer/escribir datos de verdad —
      # esa dirección tiene que ser una que el cliente pueda resolver.
      # Con un solo listener anunciado como "localhost:9092", un cliente
      # desde OTRO contenedor (Zeppelin) conecta bien al principio (el
      # nombre "kafka" si resuelve), pero luego Kafka le manda
      # reconectarse a "localhost", que dentro de ESE contenedor no
      # apunta a Kafka — la consulta no da error, pero no llegan datos
      # nunca (fallo silencioso, sin excepción).
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"
    volumes:
      - ./volumes/kafka:/tmp/kraft-combined-logs
    networks:
      - spark-hdfs-net

networks:
  spark-hdfs-net:
    driver: bridge
